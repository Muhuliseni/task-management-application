<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Task Management Application built with modern JavaScript.">

    <title>Task Manager</title>

    <link
        rel="stylesheet"
        href="styles.css">

</head>

<body>

    <main class="container">

        <header>

            <h1>Task Management System</h1>

        </header>

        <!-- ==========================
             Add Task Form
        =========================== -->

        <section
            class="add-task-section"
            aria-labelledby="add-task-heading">

            <h2 id="add-task-heading">
                Add New Task
            </h2>

            <form id="task-form">

                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter task title"
                        required>

                </div>

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter task description"></textarea>

                </div>

                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select
                        id="priority"
                        name="priority">

                        <option value="1">
                            Low
                        </option>

                        <option value="3">
                            Medium
                        </option>

                        <option value="5">
                            High
                        </option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="add-task-btn">

                    Add Task

                </button>

            </form>

        </section>

        <!-- ==========================
             Statistics
        =========================== -->

        <section
            class="statistics"
            aria-labelledby="stats-heading">

            <h2 id="stats-heading">
                Task Statistics
            </h2>

            <div id="stats-container">

                <p>
                    Total Tasks:
                    <span id="total-tasks">
                        0
                    </span>
                </p>

                <p>
                    Completed Tasks:
                    <span id="completed-tasks">
                        0
                    </span>
                </p>

                <p>
                    Pending Tasks:
                    <span id="pending-tasks">
                        0
                    </span>
                </p>

            </div>

        </section>

        <!-- ==========================
             Task List
        =========================== -->

        <section
            aria-labelledby="task-list-heading">

            <h2 id="task-list-heading">
                Task List
            </h2>

            <div
                id="task-list"
                class="task-list">

                <!-- Tasks Render Here -->

            </div>

        </section>

    </main>

    <!-- ==========================
         Scripts
    =========================== -->

    <script
        type="module"
        src="utils.js">
    </script>

    <script
        type="module"
        src="app.js">
    </script>

    <script
        type="module"
        src="dom.js">
    </script>

</body>

</html>
